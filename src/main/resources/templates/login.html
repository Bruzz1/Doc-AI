<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doc AI Login</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f3f5fb;
        }

        .card {
            width: min(420px, calc(100vw - 32px));
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 16px 32px rgba(15, 23, 42, 0.12);
            padding: 28px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.5rem;
        }

        p {
            margin: 0 0 20px;
            color: #475569;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: #1e293b;
        }

        input {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 1rem;
            margin-bottom: 14px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: #1d4ed8;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #status {
            margin-top: 12px;
            min-height: 22px;
            color: #b91c1c;
            font-size: 0.9rem;
        }

        .hint {
            margin-top: 18px;
            color: #64748b;
            font-size: 0.82rem;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Sign in</h1>
    <p>Login to access the chat and RAG workspace.</p>

    <form id="login-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <button id="login-btn" type="submit">Login</button>
    </form>

    <div id="status" aria-live="polite"></div>
    <div class="hint">Invite-only onboarding: ask an admin for an invite link/token.</div>
</div>

<script>
'use strict';

const form = document.getElementById('login-form');
const loginBtn = document.getElementById('login-btn');
const statusEl = document.getElementById('status');

async function login(event) {
    event.preventDefault();

    statusEl.textContent = '';
    loginBtn.disabled = true;

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
        const response = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ email, password }),
        });

        if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            statusEl.textContent = data.error || 'Invalid credentials';
            return;
        }

        const data = await response.json().catch(() => ({}));
        window.location.href = data.mustChangePassword ? '/change-password' : '/app';
    } catch {
        statusEl.textContent = 'Unable to reach server. Please try again.';
    } finally {
        loginBtn.disabled = false;
    }
}

form.addEventListener('submit', login);
</script>
</body>
</html>
