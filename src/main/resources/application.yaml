spring:
  application:
    name: docai
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:postgresql://localhost:5432/ics
    username: postgres
    password: postgres
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jpa:
    hibernate:
      ddl-auto: update # for dev
    show-sql: true
  ai:
    ollama:
      base-url: http://localhost:11434/
      chat:
        options:
          model: qwen2.5:3b
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        max-document-batch-size: 10000

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  info:
    env:
      enabled: true

info:
  app:
    name: My RAG Application
    version: 1.0.0

app:
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET:replace-this-with-a-long-random-secret-at-least-32-characters}
      access-token-seconds: 900
      refresh-token-seconds: 1209600
      invite-token-seconds: 604800
    cookie:
      secure: ${APP_SECURITY_COOKIE_SECURE:true}
      same-site: ${APP_SECURITY_COOKIE_SAME_SITE:Lax}
      domain: ${APP_SECURITY_COOKIE_DOMAIN:}
    bootstrap:
      enabled: ${APP_SECURITY_BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${APP_SECURITY_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_SECURITY_BOOTSTRAP_ADMIN_PASSWORD:}
      name: ${APP_SECURITY_BOOTSTRAP_ADMIN_NAME:System Admin}
      organization-id: ${APP_SECURITY_BOOTSTRAP_ORG_ID:default-org}
  knowledge:
    upload-dir: ${APP_KNOWLEDGE_UPLOAD_DIR:./uploads/pending}
  rag:
    reset-on-dimension-drift: true
    top-k: 6
    fallback-top-k: 10
    minimum-results-for-answer: 2
    similarity-threshold: 0.35
    max-context-chars: 12000
    chunk-size: 500
    min-chunk-size-chars: 150
    min-chunk-length-to-embed: 150
    max-num-chunks: 300
