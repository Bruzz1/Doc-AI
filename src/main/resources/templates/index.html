<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
</head>
<body>

<div id="app">

    <!-- ═══════════════════════════════════════
         SIDEBAR
    ═══════════════════════════════════════ -->
    <aside class="sidebar" id="sidebar">

        <!-- Brand / Tenant -->
        <div class="sidebar__brand">
            <div class="brand-logo"><span>B</span></div>
            <div class="brand-info" id="brand-info">
                <div class="brand-name" th:text="${tenantName != null ? tenantName : 'Boostware'}">Boostware</div>
                <div class="brand-tag">Enterprise Workspace</div>
            </div>
        </div>

        <!-- Collapse Toggle -->
        <button class="sidebar__toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </button>

        <!-- Navigation -->
        <nav class="sidebar__nav" aria-label="Main navigation">
            <a id="chat-nav-item" href="#" class="nav-item nav-item--active">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <span class="nav-label">Chat</span>
            </a>
            <a href="#" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
                <span class="nav-label">Documents</span>
            </a>
            <a id="knowledge-nav-item" href="#" class="nav-item" style="display:none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 4a2 2 0 0 1 2-2h10l6 6v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <path d="M14 2v6h6"/>
                    <line x1="8" y1="13" x2="16" y2="13"/>
                    <line x1="8" y1="17" x2="13" y2="17"/>
                </svg>
                <span class="nav-label">Knowledge Base</span>
            </a>
        </nav>

        <hr class="sidebar__divider" />

        <!-- Footer -->
        <div class="sidebar__footer">Powered by Spring AI &amp; pgvector</div>

    </aside>


    <!-- ═══════════════════════════════════════
         MAIN CONTENT
    ═══════════════════════════════════════ -->
    <main class="main" id="main">

        <!-- Top Bar -->
        <header class="topbar">
            <!-- Hamburger: shown only on mobile / when sidebar is collapsed -->
            <button class="topbar__menu-btn" id="mobile-menu-btn" aria-label="Open menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="6"  x2="21" y2="6"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>

            <h1 class="topbar__title" id="topbar-title">AI Chatbot</h1>

            <!-- RAG ↔ Chat mode toggle -->
            <div class="mode-toggle" id="mode-toggle-wrap" style="margin-left: auto;">
                <span class="mode-toggle__label" id="mode-label">RAG</span>
                <label class="toggle-switch" title="Switch between RAG and Chat mode">
                    <input type="checkbox" id="mode-toggle" checked />
                    <span class="toggle-switch__track"></span>
                </label>
            </div>

            <!-- User menu -->
            <div class="user-menu" id="user-menu">
                <button class="user-avatar" id="user-avatar-btn" aria-haspopup="true" aria-expanded="false" aria-label="User menu">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </button>
                <div class="user-dropdown" id="user-dropdown" role="menu">
                    <div class="user-dropdown__header" id="user-dropdown-email"></div>
                    <hr class="user-dropdown__divider" />
                    <a id="invites-menu-item" href="/admin/invites" class="user-dropdown__item" role="menuitem" style="display:none;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <line x1="23" y1="11" x2="17" y2="11"/>
                            <line x1="20" y1="8" x2="20" y2="14"/>
                        </svg>
                        Manage Invites
                    </a>
                    <button id="logout-btn" class="user-dropdown__item user-dropdown__item--danger" role="menuitem">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                        Logout
                    </button>
                </div>
            </div>
        </header>

        <!-- Chat Messages -->
        <section class="chat-messages" id="chat-messages" aria-label="Conversation" aria-live="polite">
            <div class="message message--ai">
                Hello! How can I help you with our company knowledge base today?
            </div>
        </section>

        <section class="knowledge-panel" id="knowledge-panel" style="display:none;" aria-live="polite">
            <div class="knowledge-card">
                <h2 class="knowledge-card__title">Add Knowledge</h2>
                <form id="knowledge-upload-form" class="knowledge-upload-form">
                    <input id="knowledge-file-input" type="file" accept=".pdf,.doc,.docx,.txt" required />
                    <button id="knowledge-upload-btn" type="submit">Upload</button>
                </form>
                <p id="knowledge-status" class="knowledge-status"></p>
            </div>

            <div class="knowledge-card">
                <h2 class="knowledge-card__title">Knowledge Base</h2>
                <div id="knowledge-list-status" class="knowledge-list-status">Loading knowledge...</div>
                <div class="knowledge-table-wrap">
                    <table id="knowledge-table" class="knowledge-table" style="display:none;">
                        <thead>
                        <tr>
                            <th>File</th>
                            <th>Uploaded By</th>
                            <th>Created</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody id="knowledge-table-body"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Chat Input -->
        <footer class="chat-footer" id="chat-footer">
            <div class="chat-input">
                <input id="user-input" type="text"
                       placeholder="Ask a question…"
                       autocomplete="off"
                       aria-label="Your message" />
                <button id="send-btn" aria-label="Send message">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                    <span>Send</span>
                </button>
            </div>
        </footer>

    </main>

</div><!-- /#app -->


<!-- ═══════════════════════════════════════
     JAVASCRIPT
═══════════════════════════════════════ -->
<script>
'use strict';

/* ─── DOM References ─────────────────────────────────── */
const App = {
    sidebar:       document.getElementById('sidebar'),
    sidebarToggle: document.getElementById('sidebar-toggle'),
    mobileMenuBtn: document.getElementById('mobile-menu-btn'),
    brandInfo:     document.getElementById('brand-info'),
    chatMessages:  document.getElementById('chat-messages'),
    chatFooter:    document.getElementById('chat-footer'),
    topbarTitle:   document.getElementById('topbar-title'),
    modeToggleWrap: document.getElementById('mode-toggle-wrap'),
    userInput:     document.getElementById('user-input'),
    sendBtn:       document.getElementById('send-btn'),
    modeToggle:    document.getElementById('mode-toggle'),
    modeLabel:     document.getElementById('mode-label'),
    logoutBtn:     document.getElementById('logout-btn'),
    userAvatarBtn: document.getElementById('user-avatar-btn'),
    userDropdown:  document.getElementById('user-dropdown'),
    userDropdownEmail: document.getElementById('user-dropdown-email'),
    invitesMenuItem: document.getElementById('invites-menu-item'),
    chatNavItem: document.getElementById('chat-nav-item'),
    knowledgeNavItem: document.getElementById('knowledge-nav-item'),
    knowledgePanel: document.getElementById('knowledge-panel'),
    knowledgeUploadForm: document.getElementById('knowledge-upload-form'),
    knowledgeFileInput: document.getElementById('knowledge-file-input'),
    knowledgeUploadBtn: document.getElementById('knowledge-upload-btn'),
    knowledgeStatus: document.getElementById('knowledge-status'),
    knowledgeListStatus: document.getElementById('knowledge-list-status'),
    knowledgeTable: document.getElementById('knowledge-table'),
    knowledgeTableBody: document.getElementById('knowledge-table-body'),
};

const ViewState = {
    isAdmin: false,
    currentView: 'chat',
};

const Auth = {
    async apiFetch(url, options = {}, retry = true) {
        const response = await fetch(url, {
            credentials: 'same-origin',
            ...options,
        });

        if (response.status === 401 && retry) {
            const refreshed = await this.refreshSession();
            if (refreshed) {
                return this.apiFetch(url, options, false);
            }
            window.location.href = '/login';
            throw new Error('Unauthorized');
        }

        return response;
    },

    async refreshSession() {
        try {
            const response = await fetch('/auth/refresh', {
                method: 'POST',
                credentials: 'same-origin',
            });
            return response.ok;
        } catch {
            return false;
        }
    },

    async init() {
        const response = await this.apiFetch('/auth/me', { method: 'GET' }, false);
        if (!response.ok) {
            window.location.href = '/login';
            return;
        }

        const me = await response.json();
        if (me.mustChangePassword) {
            window.location.href = '/change-password';
        }

        // Populate dropdown header and show admin-only items
        App.userDropdownEmail.textContent = me.email || me.name || '';
        if (me.role === 'ADMIN') {
            ViewState.isAdmin = true;
            App.invitesMenuItem.style.display = 'flex';
            App.knowledgeNavItem.style.display = 'flex';
        }

        return me;
    },

    async logout() {
        try {
            await fetch('/auth/logout', {
                method: 'POST',
                credentials: 'same-origin',
            });
        } finally {
            window.location.href = '/login';
        }
    },
};


/* ─── Sidebar ────────────────────────────────────────── */
const Sidebar = {
    STORAGE_KEY: 'sidebar-collapsed',

    init() {
        // Restore persisted state on load (no animation flash)
        if (localStorage.getItem(this.STORAGE_KEY) === 'true') {
            this.setCollapsed(true, false);
        }
        App.sidebarToggle.addEventListener('click', () => this.toggle());
        App.mobileMenuBtn.addEventListener('click', () => this.setCollapsed(false));
    },

    toggle() {
        this.setCollapsed(!App.sidebar.classList.contains('sidebar--collapsed'));
    },

    setCollapsed(collapsed, animate = true) {
        if (!animate) App.sidebar.style.transition = 'none';
        App.sidebar.classList.toggle('sidebar--collapsed', collapsed);
        localStorage.setItem(this.STORAGE_KEY, collapsed);
        if (!animate) requestAnimationFrame(() => (App.sidebar.style.transition = ''));
    },
};


/* ─── Markdown renderer ──────────────────────────────── */
marked.setOptions({ breaks: true, gfm: true });

function renderMarkdown(text) {
    return marked.parse(text);
}

function escapeHtml(value) {
    return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
}

function formatDate(dateStr) {
    if (!dateStr) return '-';
    const date = new Date(dateStr);
    return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

const ViewManager = {
    set(view) {
        const isKnowledge = view === 'knowledge' && ViewState.isAdmin;
        ViewState.currentView = isKnowledge ? 'knowledge' : 'chat';

        App.chatMessages.style.display = isKnowledge ? 'none' : 'flex';
        App.chatFooter.style.display = isKnowledge ? 'none' : '';
        App.knowledgePanel.style.display = isKnowledge ? 'block' : 'none';
        App.modeToggleWrap.style.display = isKnowledge ? 'none' : 'flex';
        App.topbarTitle.textContent = isKnowledge ? 'Knowledge Base' : 'AI Chatbot';

        App.chatNavItem.classList.toggle('nav-item--active', !isKnowledge);
        App.knowledgeNavItem.classList.toggle('nav-item--active', isKnowledge);

        if (!isKnowledge) {
            App.userInput.focus();
        }
    },

    init() {
        App.chatNavItem.addEventListener('click', (e) => {
            e.preventDefault();
            this.set('chat');
        });

        App.knowledgeNavItem.addEventListener('click', async (e) => {
            e.preventDefault();
            if (!ViewState.isAdmin) return;
            this.set('knowledge');
            await Knowledge.load();
        });
    },
};

const Knowledge = {
    setStatus(message, state = '') {
        App.knowledgeStatus.textContent = message;
        App.knowledgeStatus.className = `knowledge-status${state ? ' knowledge-status--' + state : ''}`;
    },

    async load() {
        App.knowledgeListStatus.style.display = 'block';
        App.knowledgeListStatus.textContent = 'Loading knowledge...';
        App.knowledgeTable.style.display = 'none';

        try {
            const response = await Auth.apiFetch('/api/admin/knowledge');
            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                throw new Error(data.error || 'Failed to load knowledge.');
            }

            const knowledgeItems = await response.json();
            if (!Array.isArray(knowledgeItems) || knowledgeItems.length === 0) {
                App.knowledgeTableBody.innerHTML = '';
                App.knowledgeListStatus.textContent = 'No knowledge uploaded yet.';
                return;
            }

            App.knowledgeTableBody.innerHTML = knowledgeItems.map((item) => `
                <tr>
                    <td>${escapeHtml(item.filename || '-')}</td>
                    <td>${escapeHtml(item.uploadedBy || '-')}</td>
                    <td>${escapeHtml(formatDate(item.createdAt))}</td>
                    <td>
                        <button type="button" class="knowledge-remove-btn" data-id="${escapeHtml(item.knowledgeId)}">Remove</button>
                    </td>
                </tr>
            `).join('');

            App.knowledgeListStatus.style.display = 'none';
            App.knowledgeTable.style.display = 'table';
        } catch (error) {
            App.knowledgeListStatus.textContent = error.message || 'Failed to load knowledge.';
            App.knowledgeListStatus.style.display = 'block';
        }
    },

    async upload(event) {
        event.preventDefault();
        if (!App.knowledgeFileInput.files[0]) {
            this.setStatus('Please select a file to upload.', 'error');
            return;
        }

        App.knowledgeUploadBtn.disabled = true;
        this.setStatus('Uploading...', 'loading');

        const body = new FormData();
        body.append('file', App.knowledgeFileInput.files[0]);

        try {
            const response = await Auth.apiFetch('/api/admin/knowledge', { method: 'POST', body });
            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                throw new Error(data.error || 'Upload failed.');
            }

            App.knowledgeFileInput.value = '';
            this.setStatus('Knowledge added successfully.', 'success');
            await this.load();
        } catch (error) {
            this.setStatus(error.message || 'Upload failed.', 'error');
        } finally {
            App.knowledgeUploadBtn.disabled = false;
        }
    },

    async remove(knowledgeId) {
        if (!knowledgeId) return;
        if (!confirm('Remove this knowledge entry?')) return;

        try {
            const response = await Auth.apiFetch(`/api/admin/knowledge/${encodeURIComponent(knowledgeId)}`, { method: 'DELETE' });
            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                throw new Error(data.error || 'Delete failed.');
            }
            this.setStatus('Knowledge removed.', 'success');
            await this.load();
        } catch (error) {
            this.setStatus(error.message || 'Delete failed.', 'error');
        }
    },

    init() {
        App.knowledgeUploadForm.addEventListener('submit', (event) => this.upload(event));
        App.knowledgeTableBody.addEventListener('click', (event) => {
            const button = event.target.closest('.knowledge-remove-btn');
            if (!button) return;
            this.remove(button.getAttribute('data-id'));
        });
    },
};

/* ─── Chat ───────────────────────────────────────────── */
const Chat = {
    appendMessage(text, type) {
        const div = document.createElement('div');
        div.className = `message message--${type}`;
        if (type === 'ai') {
            div.innerHTML = renderMarkdown(text);
        } else {
            div.textContent = text;
        }
        App.chatMessages.appendChild(div);
        this.scrollToBottom();
        return div;
    },

    createTypingBubble() {
        const div = document.createElement('div');
        div.className = 'message message--ai message--typing';
        for (let i = 0; i < 3; i++) {
            const dot = document.createElement('span');
            dot.className = 'typing-dot';
            div.appendChild(dot);
        }
        App.chatMessages.appendChild(div);
        this.scrollToBottom();
        return div;
    },

    typeEffect(element, text, speed = 8) {
        let i = 0;
        let partial = '';
        const tick = setInterval(() => {
            if (i < text.length) {
                partial += text[i++];
                element.innerHTML = renderMarkdown(partial);
                this.scrollToBottom();
            } else {
                clearInterval(tick);
                // Final render to ensure complete markdown
                element.innerHTML = renderMarkdown(text);
                this.scrollToBottom();
            }
        }, speed);
    },

    scrollToBottom() {
        App.chatMessages.scrollTop = App.chatMessages.scrollHeight;
    },

    getEndpoint() {
        return App.modeToggle.checked ? '/faqs' : '/chat';
    },

    updateModeLabel() {
        App.modeLabel.textContent = App.modeToggle.checked ? 'RAG' : 'Chat';
    },

    async send() {
        const question = App.userInput.value.trim();
        if (!question) return;

        this.appendMessage(question, 'user');
        App.userInput.value = '';
        App.sendBtn.disabled = true;

        const endpoint  = this.getEndpoint();
        const paramName = endpoint === '/chat' ? 'message' : 'question';
        const url       = `${endpoint}?${paramName}=${encodeURIComponent(question)}`;
        const bubble    = this.createTypingBubble();

        try {
            const res    = await Auth.apiFetch(url);
            const answer = await res.text();
            bubble.innerHTML = '';
            bubble.classList.remove('message--typing');
            answer.length > 300
                ? (bubble.innerHTML = renderMarkdown(answer), this.scrollToBottom())
                : this.typeEffect(bubble, answer);
        } catch {
            bubble.textContent = 'Error: Could not reach the server.';
            bubble.classList.remove('message--typing');
        } finally {
            App.sendBtn.disabled = false;
            App.userInput.focus();
        }
    },

    init() {
        App.sendBtn.addEventListener('click',   () => this.send());
        App.userInput.addEventListener('keydown', e => { if (e.key === 'Enter') this.send(); });
        App.modeToggle.addEventListener('change', () => this.updateModeLabel());
        this.updateModeLabel();
        App.userInput.focus();
    },
};


/* ─── Boot ───────────────────────────────────────────── */
(async () => {
    const me = await Auth.init();
    if (!me) return;

    Sidebar.init();
    ViewManager.init();
    Chat.init();
    if (ViewState.isAdmin) {
        Knowledge.init();
    }
    ViewManager.set('chat');
    App.logoutBtn.addEventListener('click', () => Auth.logout());

    // User avatar dropdown toggle
    App.userAvatarBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = App.userDropdown.classList.toggle('user-dropdown--open');
        App.userAvatarBtn.setAttribute('aria-expanded', isOpen);
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', () => {
        App.userDropdown.classList.remove('user-dropdown--open');
        App.userAvatarBtn.setAttribute('aria-expanded', 'false');
    });
})();
</script>

</body>
</html>
