<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f3f5fb;
        }

        .card {
            width: min(440px, calc(100vw - 32px));
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 16px 32px rgba(15, 23, 42, 0.12);
            padding: 28px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.5rem;
        }

        p {
            margin: 0 0 20px;
            color: #475569;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: #1e293b;
        }

        input {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 1rem;
            margin-bottom: 14px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: #1d4ed8;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #status {
            margin-top: 12px;
            min-height: 22px;
            color: #b91c1c;
            font-size: 0.9rem;
        }

        #status.success {
            color: #166534;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Rotate your password</h1>
    <p>Your account is using a bootstrap password. Update it before continuing.</p>

    <form id="change-password-form">
        <label for="currentPassword">Current password</label>
        <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required />

        <label for="newPassword">New password</label>
        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" required />

        <button id="change-password-btn" type="submit">Update password</button>
    </form>

    <div id="status" aria-live="polite"></div>
</div>

<script>
'use strict';

const form = document.getElementById('change-password-form');
const button = document.getElementById('change-password-btn');
const statusEl = document.getElementById('status');

async function assertAuthenticated() {
    const response = await fetch('/auth/me', {
        method: 'GET',
        credentials: 'same-origin',
    });

    if (!response.ok) {
        window.location.href = '/login';
        return;
    }

    const data = await response.json();
    if (!data.mustChangePassword) {
        window.location.href = '/app';
    }
}

async function submitChangePassword(event) {
    event.preventDefault();
    statusEl.className = '';
    statusEl.textContent = '';
    button.disabled = true;

    const currentPassword = document.getElementById('currentPassword').value;
    const newPassword = document.getElementById('newPassword').value;

    try {
        const response = await fetch('/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ currentPassword, newPassword }),
        });

        if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            statusEl.textContent = data.error || 'Could not update password.';
            return;
        }

        statusEl.className = 'success';
        statusEl.textContent = 'Password updated. Redirecting...';
        setTimeout(() => {
            window.location.href = '/app';
        }, 600);
    } catch {
        statusEl.textContent = 'Unable to reach server. Please try again.';
    } finally {
        button.disabled = false;
    }
}

form.addEventListener('submit', submitChangePassword);
assertAuthenticated();
</script>
</body>
</html>
