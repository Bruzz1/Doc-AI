spring:
  application:
    name: docai
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  datasource:
    url: jdbc:postgresql://localhost:5432/ics
    username: postgres
    password: postgres
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  ai:
    ollama:
      base-url: http://localhost:11434/
      chat:
        options:
          model: qwen2.5:3b
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        max-document-batch-size: 10000

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: docai

info:
  app:
    name: My RAG Application
    version: 1.0.0

app:
  tenant:
    rls-enabled: ${APP_TENANT_RLS_ENABLED:false}
    default-max-documents: ${APP_TENANT_DEFAULT_MAX_DOCUMENTS:0}
  agent:
    conversation-idle-minutes: ${APP_AGENT_CONVERSATION_IDLE_MINUTES:30}
  ingest:
    core-pool-size: ${APP_INGEST_CORE_POOL_SIZE:2}
    max-pool-size: ${APP_INGEST_MAX_POOL_SIZE:4}
    queue-capacity: ${APP_INGEST_QUEUE_CAPACITY:50}
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET:replace-this-with-a-long-random-secret-at-least-32-characters}
      access-token-seconds: 900
      refresh-token-seconds: 1209600
      invite-token-seconds: 604800
    cookie:
      secure: ${APP_SECURITY_COOKIE_SECURE:true}
      same-site: ${APP_SECURITY_COOKIE_SAME_SITE:Lax}
      domain: ${APP_SECURITY_COOKIE_DOMAIN:}
    bootstrap:
      enabled: ${APP_SECURITY_BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${APP_SECURITY_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_SECURITY_BOOTSTRAP_ADMIN_PASSWORD:}
      name: ${APP_SECURITY_BOOTSTRAP_ADMIN_NAME:System Admin}
      organization-id: ${APP_SECURITY_BOOTSTRAP_ORG_ID:default-org}
  rag:
    top-k: 6
    fallback-top-k: 10
    minimum-results-for-answer: 2
    similarity-threshold: 0.35
    max-context-chars: 12000
    chunk-size: 500
    min-chunk-size-chars: 150
    min-chunk-length-to-embed: 150
    max-num-chunks: 300
  whatsapp:
    verify-token: ${APP_WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${APP_WHATSAPP_APP_SECRET:}
    access-token: ${APP_WHATSAPP_ACCESS_TOKEN:}
    api-base-url: ${APP_WHATSAPP_API_BASE_URL:https://graph.facebook.com/v20.0}
    default-organization-id: ${APP_WHATSAPP_DEFAULT_ORG_ID:}
  guardrails:
    max-input-chars: ${APP_GUARDRAILS_MAX_INPUT_CHARS:4000}
    max-output-chars: ${APP_GUARDRAILS_MAX_OUTPUT_CHARS:8000}
    requests-per-minute-per-org: ${APP_GUARDRAILS_REQUESTS_PER_MINUTE_PER_ORG:60}
